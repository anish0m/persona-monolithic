# ---------------------------------------------------------------------------
# Test configuration. Spring Boot prefers this file over the main one when
# running tests, so nothing here affects the running application.
#
# WHY THE TEST PROFILE EXISTS
#
# Day-03 introduced two implementations of UserRepository, selected by profile:
#
#     @Profile("test")   InMemoryUserRepository
#     @Profile("!test")  JdbcUserRepository
#
# Without this line, the test suite would pick the JDBC one and every test
# would need a running PostgreSQL. That is a real trade and worth naming:
#
#   in-memory     fast, no setup, and tests NOTHING about the SQL
#   real database slow, needs a container, and tests what actually ships
#
# The honest answer is BOTH, at different levels. The controller and service
# tests do not care where data lives, so they use the fast fake. The
# repository's SQL genuinely cannot be tested without a database, and
# JdbcUserRepositoryIT does that against a real Postgres.
#
# The failure to avoid is a suite that is entirely fakes: it goes green while
# the SQL has a typo in a column name, because nothing ever executed it.
# ---------------------------------------------------------------------------
spring.profiles.active=test


# No DataSource is needed under the test profile, and asking Spring Boot to
# auto-configure one would make every test depend on a database being
# reachable. Excluding them here is what keeps the fast tests honest about
# being fast tests.
# NOTE the profile-specific form: these exclusions apply ONLY when the "test"
# profile is active. Spring MERGES property lists across profiles rather than
# replacing them, so putting them in the unqualified file and then writing an
# empty value in application-jdbc-it.properties does NOT switch them back on —
# a mistake worth recording, because the symptom was a silent one: Flyway never
# ran, no log line said so, and the failure surfaced as
# 'relation "users" does not exist'.
#
# The --- below starts a second DOCUMENT in this file. Everything after it is
# conditional on the profile named in spring.config.activate.on-profile.
#
# ⚠️ DAY-07 — THIS SEPARATOR WAS WRITTEN `#---` AND WAS THEREFORE A COMMENT.
#
# A `#---` is not a document separator; it is a line of text Spring never
# reads. So `spring.config.activate.on-profile=test` below was not the header
# of a second document — it was an ordinary property sitting in the FIRST one,
# and its effect was to make THE ENTIRE FILE conditional on the test profile.
#
# That was a real bug and the `---` below is the fix. But it is worth being
# precise about what it did NOT fix, because an afternoon went into finding
# that out: correcting it did not make the JWT properties reach the *-it
# suites. Neither did adding them above this line, nor adding them in a third
# document below. Those properties now live in application-jdbc-it.properties
# and application-jpa-it.properties, duplicated on purpose, with the full
# account of the four attempts written there.
#
# The honest summary: this file's scoping behaviour was understood well enough
# to find a one-character bug in it, and not well enough to predict where a
# new property would land. Those are different things, and the second one was
# settled by running the suite rather than by reasoning about it.
---
spring.config.activate.on-profile=test
# Day-04 adds the third and fourth exclusions. Without them the JPA
# auto-configuration starts Hibernate, which needs a DataSource, which the first
# exclusion just removed — so the fast tests would fail on a database they were
# specifically designed not to need. Each line is one auto-configuration that
# would otherwise reach for a database.
#
# NOTE THE PACKAGE, because guessing it cost time here. Boot 4 split
# spring-boot-autoconfigure into per-technology modules, and the module a class
# lives in is NOT predictable from the property that switches it on:
#
#   spring.jpa.*  is configured by ... boot.hibernate.autoconfigure.*
#                                          ^^^^^^^^^
#                 living in the spring-boot-hibernate jar, NOT spring-boot-jpa.
#
# spring-boot-jpa contains JpaBaseConfiguration and nothing named
# HibernateJpaAutoConfiguration at all. This was verified by listing the jars
# rather than by recalling it — the same method that found the missing
# spring-boot-flyway on Day-03, and the same lesson: a plausible class name is
# not evidence. A wrong name here would be IGNORED SILENTLY, not rejected,
# because an exclusion for a class that does not exist is simply not applied.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
