# ---------------------------------------------------------------------------
# Profile: jpa-it. Used only by JpaUserRepositoryIT.  Day-04.
#
# The sibling of application-jdbc-it.properties, pointing at the same database
# and the same Flyway migrations. Two integration suites, two implementations,
# ONE schema — which is the point. If V1 were wrong, both would fail.
#
#     docker compose up -d persona-monolith-db
#     mvn test -Dit=true
#
# Port 5434 — the HOST-side mapping from docker-compose.yml.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/persona
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# VALIDATE, exactly as in production. Using `create-drop` here — which is what
# most tutorials do for tests — would be actively harmful: the suite would build
# its own schema from the entities and pass, while proving NOTHING about whether
# the entities match the migrations that ship. The mismatch would surface in
# production instead, which is the failure this profile exists to prevent.
#
# So this integration test genuinely tests V1 and the @Column annotations
# TOGETHER. A wrong length, a wrong nullability, a missing column: startup fails
# here, on a developer machine, rather than at deployment.
spring.jpa.hibernate.ddl-auto=validate

# Statement counting is the only way to see N+1, so the SQL must be visible.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
#  JWT signing properties, duplicated into BOTH *-it profile files.
#
#  Needed because a @SpringBootTest builds the whole application context,
#  which includes JwtService, and it cannot be built without a signing key.
#  Absent these, the context fails to start and every test in the profile
#  errors before its first assertion.
#
#  WHY NOT ONCE, IN application.properties? Because that file is shadowed and
#  profile-scoped in ways that cost four attempts to pin down:
#
#    - putting them at the TOP of it did not work;
#    - putting them in a separate unconditional document after `---` did not
#      work either.
#
#  A genuine one-character bug was found on the way past — that file's profile
#  separator had been written `#---`, a comment rather than a separator — and
#  fixing it was correct but did not fix THIS. Two different problems that
#  produced the same error message.
#
#  The values themselves were proven fine by passing them as -D JVM args,
#  which made the suite green and isolated "wrong values" from "values never
#  arrive". It was always the second.
#
#  So they live here, next to the datasource settings each IT already needs,
#  in the file whose profile is named in the test's own @ActiveProfiles. The
#  duplication is real and is the lesser cost: a missing property fails loudly
#  at context startup, whereas a clever single definition failed silently and
#  took four attempts to explain.
#
#  A DIFFERENT SECRET FROM PRODUCTION, deliberately — a test passing with the
#  real signing key would keep passing after that key is rotated, and is one
#  more place the real key is written down.
# ---------------------------------------------------------------------------
persona.jwt.secret=1111111111111111111111111111111111111111111111111111111111111111
persona.jwt.expiration-ms=900000
