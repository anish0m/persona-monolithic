# ---------------------------------------------------------------------------
# Profile: jpa-it. Used only by JpaUserRepositoryIT.  Day-04.
#
# The sibling of application-jdbc-it.properties, pointing at the same database
# and the same Flyway migrations. Two integration suites, two implementations,
# ONE schema — which is the point. If V1 were wrong, both would fail.
#
#     docker compose up -d persona-monolith-db
#     mvn test -Dit=true
#
# Port 5434 — the HOST-side mapping from docker-compose.yml.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/persona
spring.datasource.username=persona
spring.datasource.password=persona
spring.flyway.enabled=true

# VALIDATE, exactly as in production. Using `create-drop` here — which is what
# most tutorials do for tests — would be actively harmful: the suite would build
# its own schema from the entities and pass, while proving NOTHING about whether
# the entities match the migrations that ship. The mismatch would surface in
# production instead, which is the failure this profile exists to prevent.
#
# So this integration test genuinely tests V1 and the @Column annotations
# TOGETHER. A wrong length, a wrong nullability, a missing column: startup fails
# here, on a developer machine, rather than at deployment.
spring.jpa.hibernate.ddl-auto=validate

# Statement counting is the only way to see N+1, so the SQL must be visible.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
