# ---------------------------------------------------------------------------
# persona - monolith configuration
#
# Spring Boot reads this file automatically at startup. Anything set here
# overrides Spring Boot's built-in defaults.
# ---------------------------------------------------------------------------

# The name shown in logs and, later, in monitoring/actuator endpoints.
spring.application.name=persona-monolith

# The embedded Tomcat port. 8080 is the default; stated explicitly because on
# Day-17 the microservice split gives every service its own port and we will want
# to see them side by side.
server.port=8080

# ---------------------------------------------------------------------------
# Day-03/04 will add the PostgreSQL settings here:
#   spring.datasource.url / username / password
#   spring.jpa.hibernate.ddl-auto
# Left out for now on purpose - the app must be runnable before a DB exists.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Day-03 — PostgreSQL.
#
# These are DEFAULTS for running outside Docker. docker-compose.yml overrides
# all three with SPRING_DATASOURCE_* environment variables (relaxed binding:
# SPRING_DATASOURCE_URL -> spring.datasource.url), because inside the network
# the host is the service name, not localhost.
#
# The password is in this file, in git, which is wrong and is a dated debt:
# Day-13 moves it to an environment variable. It is here today so there is
# exactly one new concept at a time.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/persona
spring.datasource.username=persona
spring.datasource.password=persona

# Fail fast and loudly if a migration does not apply, rather than starting an
# application whose schema is not what the code expects.
spring.flyway.enabled=true
