# ---------------------------------------------------------------------------
# persona - monolith configuration
#
# Spring Boot reads this file automatically at startup. Anything set here
# overrides Spring Boot's built-in defaults.
# ---------------------------------------------------------------------------

# The name shown in logs and, later, in monitoring/actuator endpoints.
spring.application.name=persona-monolith

# The embedded Tomcat port. 8080 is the default; stated explicitly because on
# Day-17 the microservice split gives every service its own port and we will want
# to see them side by side.
server.port=8080

# ---------------------------------------------------------------------------
# Day-03/04 will add the PostgreSQL settings here:
#   spring.datasource.url / username / password
#   spring.jpa.hibernate.ddl-auto
# Left out for now on purpose - the app must be runnable before a DB exists.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Day-03 — PostgreSQL.
#
# These are DEFAULTS for running outside Docker. docker-compose.yml overrides
# all three with SPRING_DATASOURCE_* environment variables (relaxed binding:
# SPRING_DATASOURCE_URL -> spring.datasource.url), because inside the network
# the host is the service name, not localhost.
#
# The password is in this file, in git, which is wrong and is a dated debt:
# Day-13 moves it to an environment variable. It is here today so there is
# exactly one new concept at a time.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5434/persona
spring.datasource.username=persona
spring.datasource.password=persona

# Fail fast and loudly if a migration does not apply, rather than starting an
# application whose schema is not what the code expects.
spring.flyway.enabled=true

# ---------------------------------------------------------------------------
# Day-04 — which UserRepository implementation is live.
#
# There are now THREE, and they name themselves positively:
#
#     test   InMemoryUserRepository   a HashMap, no database          (slice 4)
#     jdbc   JdbcUserRepository       hand-written SQL, JdbcClient    (Day-03)
#     jpa    JpaUserRepository        Hibernate via Spring Data       (Day-04)
#
# Exactly one may be active. Two matching profiles is
# NoUniqueBeanDefinitionException at startup; none is
# NoSuchBeanDefinitionException. Both fail loudly at boot, which is the point.
#
# Switch without editing this file:  --spring.profiles.active=jdbc
# The Day-03 implementation is still there and still works; the profile is the
# whole switch.
# ---------------------------------------------------------------------------
spring.profiles.active=jpa

# ---------------------------------------------------------------------------
# VALIDATE. Never `update`, and this is the most important line in the file.
#
#   validate  check every @Entity claim against the real schema, refuse to
#             start if any is wrong. Changes nothing.
#   update    silently ALTER TABLE until Hibernate is right.
#   create    drop and recreate on every start. Data loss as a default.
#
# FLYWAY OWNS THE SCHEMA — that was decided on Day-03 and this line is what
# keeps it true. With `update`, Hibernate would quietly alter tables until V1
# no longer described the real database, a teammate cloning the repo would get
# a different schema, and nothing would have said so. That is precisely the
# Day-03 failure mode: present but not participating, surfacing one layer away.
#
# With `validate`, a mismatch between the entity and the migration is a startup
# failure naming the column. Loud, immediate, at the right place.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# Log the SQL Hibernate generates, formatted. Not a debugging convenience — it
# is the ONLY way to see an N+1 problem, which is invisible in the Java and
# obvious in the log. Count the statements, do not reason about them.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-Session-In-View: OFF, deliberately.
#
# Boot's default is ON, which holds the persistence context open for the whole
# HTTP request so lazy loading still works inside the controller and the JSON
# serializer. That sounds helpful and hides the two problems worth seeing: it
# keeps a database connection checked out for the entire request, and it lets
# N+1 queries happen during JSON serialization where no code shows them.
#
# Off, a lazy association touched outside the transaction throws
# LazyInitializationException. That is the correct, loud signal that data should
# have been fetched inside the transaction or mapped to a DTO first — which
# UserResponse.from(user) already does, for a different reason.
spring.jpa.open-in-view=false
